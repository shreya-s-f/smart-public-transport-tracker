<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transit.IN - Authentication</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/style.css?v=5">
    <script src="js/auth.js?v=5"></script>

    <style>
        body {
            background-image: url('https://images.unsplash.com/photo-1570125909232-eb263c188f7e?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            position: relative;
        }
        
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(8px);
            z-index: 0;
        }

        .login-card {
            position: relative;
            z-index: 1;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2.5rem;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .tab-btn {
            flex: 1;
            padding: 0.7rem;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .login-input {
            width: 100%;
            padding: 0.8rem 1rem;
            margin-bottom: 1rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 8px;
            font-family: inherit;
        }
        
        .login-input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .btn-primary {
            width: 100%;
            padding: 0.9rem;
            font-size: 1rem;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="login-card animate-fade-in-up">
        <div style="font-size: 2.5rem; color: var(--accent-color); margin-bottom: 0.8rem;" class="animate-float">
            <i class="fa-solid fa-bus"></i>
        </div>
        <h2 style="margin-bottom: 0.3rem; color: white;">Transit.IN Portal</h2>
        <p style="color: var(--text-secondary); margin-bottom: 1.5rem; font-size: 0.9rem;">Sign in to access transport services</p>

        <!-- Role Tabs -->
        <div style="display: flex; border-radius: 8px; overflow: hidden; margin-bottom: 1.5rem;">
            <button id="tab-passenger" class="tab-btn active" onclick="switchRole('passenger')"><i class="fa-solid fa-user"></i> Passenger</button>
            <button id="tab-admin" class="tab-btn" onclick="switchRole('admin')"><i class="fa-solid fa-user-shield"></i> Admin Portal</button>
        </div>

        <form id="auth-form">
            <input type="hidden" id="selected-role" value="passenger">

            <div style="text-align: left; margin-bottom: 0.5rem;">
                <label style="font-size: 0.85rem; color: var(--text-secondary);" id="email-label">Passenger Email / ID</label>
                <input type="text" id="email" class="login-input" placeholder="e.g. shreya@gmail.com" required>
            </div>
            
            <div style="text-align: left; margin-bottom: 1rem;">
                <label style="font-size: 0.85rem; color: var(--text-secondary);" id="password-label">Password</label>
                <input type="password" id="password" class="login-input" placeholder="Enter password" required>
            </div>

            <button type="submit" id="submit-btn" class="btn-primary btn-pulse">Sign In as Passenger <i class="fa-solid fa-arrow-right"></i></button>
        </form>
    </div>

    <script>
        function switchRole(role) {
            document.getElementById('selected-role').value = role;
            const passengerTab = document.getElementById('tab-passenger');
            const adminTab = document.getElementById('tab-admin');
            const submitBtn = document.getElementById('submit-btn');
            const emailInput = document.getElementById('email');
            const passInput = document.getElementById('password');

            if (role === 'admin') {
                passengerTab.classList.remove('active');
                adminTab.classList.add('active');
                emailInput.placeholder = "Admin Username / Email";
                passInput.placeholder = "••••••••";
                submitBtn.innerHTML = 'Sign In as Admin <i class="fa-solid fa-shield-halved"></i>';
                submitBtn.style.background = 'var(--warning-color)';
            } else {
                adminTab.classList.remove('active');
                passengerTab.classList.add('active');
                emailInput.placeholder = "e.g. shreya@gmail.com";
                passInput.placeholder = "Enter password";
                submitBtn.innerHTML = 'Sign In as Passenger <i class="fa-solid fa-arrow-right"></i>';
                submitBtn.style.background = 'var(--accent-color)';
            }
        }

        document.getElementById('auth-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const role = document.getElementById('selected-role').value;
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value.trim();

            const isAdminCreds = (email === 'admin@transit' || pass === 'admin@transit' || pass === 'admin123' || role === 'admin');

            if (role === 'admin' || isAdminCreds) {
                if (pass === 'admin@transit' || pass === 'admin123' || email === 'admin@transit' || role === 'admin') {
                    localStorage.setItem('spt-authenticated', 'true');
                    localStorage.setItem('spt-user-role', 'admin');
                    localStorage.setItem('spt-profile-name', 'System Admin');
                    
                    document.body.style.opacity = '0';
                    document.body.style.transition = 'opacity 0.4s ease';
                    setTimeout(() => window.location.href = 'admin.html', 400);
                } else {
                    alert('Invalid Admin Credentials! Please enter valid admin credentials.');
                }
            } else {
                // Passenger Login
                const name = email.includes('@') ? email.split('@')[0] : email;
                const formattedName = name.charAt(0).toUpperCase() + name.slice(1);
                
                localStorage.setItem('spt-authenticated', 'true');
                localStorage.setItem('spt-user-role', 'passenger');
                localStorage.setItem('spt-profile-name', formattedName);
                
                if(!localStorage.getItem('spt-user-profile-data')) {
                    localStorage.setItem('spt-user-profile-data', JSON.stringify({
                        name: formattedName,
                        email: email.includes('@') ? email : `${email}@gmail.com`,
                        phone: '+91 98765 43210',
                        city: 'Delhi'
                    }));
                }
                
                document.body.style.opacity = '0';
                document.body.style.transition = 'opacity 0.4s ease';
                setTimeout(() => window.location.href = 'index.html', 400);
            }
        });
    </script>
</body>
</html>
