<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Transport Tracker - Alerts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">
            <i class="fa-solid fa-bus"></i> Transit.IN
        </div>
        
        <div class="nav-links" id="nav-links">
            <a href="index.html">Dashboard</a>
            <a href="routes.html">Routes</a>
            <a href="tracking.html">Live Tracking</a>
            <a href="timetable.html">Timetable</a>
            <a href="notifications.html" class="active">Alerts</a>
            <a href="booking.html" style="color: var(--accent-color); font-weight: 700;"><i class="fa-solid fa-ticket"></i> Book Ticket</a>
            <a href="profile.html">Profile</a>
        </div>
        
        <div class="nav-actions">
            <select class="city-selector" aria-label="Select City">
                <option value="Delhi">Delhi</option>
                <option value="Mumbai">Mumbai</option>
                <option value="Bangalore">Bangalore</option>
            </select>
            <button id="theme-toggle" class="theme-toggle">
                <i id="theme-icon" class="fa-solid fa-moon"></i>
            </button>
            <button id="mobile-menu-btn" class="mobile-menu-btn">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
    </nav>

    <main>
        <h2 id="alerts-heading" style="margin-bottom: 1.5rem;">System Alerts & Updates</h2>
        
        <div class="glass-card animate-fade-in-up">
            <div id="notifications-container">
                <!-- Populated by JS -->
            </div>
        </div>
        </main>

    <!-- Professional Footer -->
    <footer style="margin-top: 4rem; padding: 2rem; border-top: 1px solid var(--card-border); text-align: center; color: var(--text-secondary);">
        <p style="font-weight: 600; color: var(--text-primary); margin-bottom: 0.5rem;"><i class="fa-solid fa-bus"></i> Transit.IN</p>
        <p style="font-size: 0.9rem; margin-bottom: 1rem;">Smart Public Transport Tracker</p>
        <div style="display: flex; justify-content: center; gap: 1.5rem; font-size: 1.2rem;">
            <a href="#" style="color: var(--text-secondary); transition: color 0.2s;"><i class="fa-brands fa-github"></i></a>
            <a href="#" style="color: var(--text-secondary); transition: color 0.2s;"><i class="fa-brands fa-linkedin"></i></a>
        </div>
        <p style="font-size: 0.8rem; margin-top: 1.5rem;">Developed by Shreya &copy; 2026</p>
    </footer>

    <!-- Loading Overlay -->
    <div id="city-loader" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg-color); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.3s;">
        <div class="spinner"></div>
        <h2 style="margin-top: 1rem; color: var(--accent-color);" id="loader-text">Loading...</h2>
    </div>

    <script src="js/app.js"></script>
    <script src="js/notifications.js"></script>
</body>
</html>
