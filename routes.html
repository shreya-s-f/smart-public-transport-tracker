<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Transport Tracker - Routes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css?v=6">
    <script src="js/auth.js?v=6"></script>
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">
            <i class="fa-solid fa-bus"></i> Transit.IN
        </div>
        
        <div class="nav-links" id="nav-links">
            <a href="index.html">Dashboard</a>
            <a href="routes.html" class="active">Routes</a>
            <a href="tracking.html">Live Tracking</a>
            <a href="timetable.html">Timetable</a>
            <a href="notifications.html">Alerts</a>
            <a href="booking.html"><i class="fa-solid fa-ticket"></i> Book Ticket</a>
            <a href="profile.html">Profile</a>
        </div>
        
        <div class="nav-actions">
            <!-- City Selector -->
            <select class="city-selector" aria-label="Select City">
                <option value="Delhi">Delhi</option>
                <option value="Mumbai">Mumbai</option>
                <option value="Bangalore">Bangalore</option>
            </select>
            <button id="theme-toggle" class="theme-toggle">
                <i id="theme-icon" class="fa-solid fa-moon"></i>
            </button>
            <button id="mobile-menu-btn" class="mobile-menu-btn">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
    </nav>

    <main>
        <div class="search-container" style="margin-bottom: 1rem;">
            <input type="text" id="route-search" class="search-input" placeholder="Search routes by bus number, stop or area (e.g. Airport, Whitefield, AIIMS)...">
        </div>

        <!-- Category Filter Pills -->
        <div class="filter-pills" id="route-category-filters">
            <button class="filter-pill active" data-category="all"><i class="fa-solid fa-list-check"></i> All Routes</button>
            <button class="filter-pill" data-category="electric"><i class="fa-solid fa-bolt" style="color: #10b981;"></i> Electric Fleet</button>
            <button class="filter-pill" data-category="ac"><i class="fa-solid fa-snowflake" style="color: #3b82f6;"></i> AC Express</button>
            <button class="filter-pill" data-category="airport"><i class="fa-solid fa-plane-departure" style="color: #f59e0b;"></i> Airport Lines</button>
            <button class="filter-pill" data-category="feeder"><i class="fa-solid fa-train-subway" style="color: #8b5cf6;"></i> Metro Feeder</button>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
            <h2 id="routes-heading">Available Routes</h2>
            <span id="route-counter-badge" style="font-size: 0.85rem; background: rgba(59, 130, 246, 0.1); color: var(--accent-color); padding: 0.35rem 0.8rem; border-radius: 20px; font-weight: 600;">Showing 0 routes</span>
        </div>
        
        <div class="route-list" id="route-list-container">
            <!-- Routes will be injected here via JavaScript -->
        </div>
    </main>

    <!-- Professional Footer -->
    <footer style="margin-top: 4rem; padding: 2rem; border-top: 1px solid var(--card-border); text-align: center; color: var(--text-secondary);">
        <p style="font-weight: 600; color: var(--text-primary); margin-bottom: 0.5rem;"><i class="fa-solid fa-bus"></i> Transit.IN</p>
        <p style="font-size: 0.9rem; margin-bottom: 1rem;">Smart Public Transport Tracker</p>
                <div style="display: flex; justify-content: center; align-items: center; gap: 1.5rem; font-size: 1rem; flex-wrap: wrap;">
            <a href="https://github.com/shreya-s-f/smart-public-transport-tracker" target="_blank" rel="noopener noreferrer" style="color: var(--text-secondary); transition: color 0.2s;" title="GitHub Repository"><i class="fa-brands fa-github"></i> GitHub</a>
            <a href="https://www.linkedin.com/in/shreya-fakirapur-557388324" target="_blank" rel="noopener noreferrer" style="color: var(--text-secondary); transition: color 0.2s;" title="LinkedIn"><i class="fa-brands fa-linkedin"></i> LinkedIn</a>
            <a href="admin.html" style="color: var(--warning-color); font-weight: 600; transition: color 0.2s;" title="Admin Portal"><i class="fa-solid fa-user-shield"></i> Admin Portal</a>
        </div>
        <p style="font-size: 0.8rem; margin-top: 1.5rem;">Developed by Shreya &copy; 2026</p>
    </footer>

    <!-- Loading Overlay -->
    <div id="city-loader" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg-color); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.3s;">
        <div class="spinner"></div>
        <h2 style="margin-top: 1rem; color: var(--accent-color);" id="loader-text">Loading...</h2>
    </div>

    <script src="js/app.js?v=6"></script>
    <script src="js/transit-data.js"></script>
    <script src="js/routes.js"></script>
</body>
</html>
