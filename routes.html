<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Transport Tracker - Routes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">
            <i class="fa-solid fa-bus"></i> TrackerPro
        </div>
        
        <div class="nav-links" id="nav-links">
            <a href="index.html">Dashboard</a>
            <a href="routes.html" class="active">Routes</a>
            <a href="tracking.html">Live Tracking</a>
            <a href="timetable.html">Timetable</a>
            <a href="notifications.html">Alerts</a>
            <a href="profile.html">Profile</a>
        </div>
        
        <div class="nav-actions">
            <button id="theme-toggle" class="theme-toggle">
                <i id="theme-icon" class="fa-solid fa-moon"></i>
            </button>
            <button id="mobile-menu-btn" class="mobile-menu-btn">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
    </nav>

    <main>
        <div class="search-container" style="margin-bottom: 2rem;">
            <input type="text" id="route-search" class="search-input" placeholder="Search routes (e.g. 10A, Downtown)">
        </div>

        <h2 style="margin-bottom: 1.5rem;">Available Routes</h2>
        
        <div class="route-list" id="route-list-container">
            <!-- Routes will be injected here via JavaScript -->
        </div>
    </main>

    <script src="js/app.js"></script>
    <script src="js/routes.js"></script>
</body>
</html>
