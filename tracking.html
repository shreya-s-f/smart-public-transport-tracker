<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Transport Tracker - Live Tracking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <link rel="stylesheet" href="css/style.css">
    <style>
        .tracker-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .eta-badge {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        /* Fix map z-index inside the glass UI */
        #map-container {
            z-index: 1; 
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">
            <i class="fa-solid fa-bus"></i> Transit.IN
        </div>
        
        <div class="nav-links" id="nav-links">
            <a href="index.html">Dashboard</a>
            <a href="routes.html">Routes</a>
            <a href="tracking.html" class="active">Live Tracking</a>
            <a href="timetable.html">Timetable</a>
            <a href="notifications.html">Alerts</a>
            <a href="profile.html">Profile</a>
        </div>
        
        <div class="nav-actions">
            <button id="theme-toggle" class="theme-toggle">
                <i id="theme-icon" class="fa-solid fa-moon"></i>
            </button>
            <button id="mobile-menu-btn" class="mobile-menu-btn">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
    </nav>

    <main>
        <div class="glass-card" style="margin-bottom: 2rem;">
            <div class="tracker-header">
                <div>
                    <h2 id="tracking-route-title" style="color: var(--accent-color); margin-bottom: 0.2rem;">Route 10A Tracking</h2>
                    <p id="tracking-route-path" style="color: var(--text-secondary);">Downtown ➔ Tech Park</p>
                </div>
                <div class="eta-badge" id="eta-display">
                    <i class="fa-solid fa-clock"></i> ETA: 5 mins away
                </div>
            </div>
            
            <div id="map-container"></div>
            
            <div style="margin-top: 1rem; color: var(--text-secondary); font-size: 0.9rem; display: flex; align-items: center; gap: 0.5rem;">
                <i class="fa-solid fa-circle-info"></i> Simulation Mode: Bus movement is updated every second.
            </div>
        </div>
        </main>

    <!-- Professional Footer -->
    <footer style="margin-top: 4rem; padding: 2rem; border-top: 1px solid var(--card-border); text-align: center; color: var(--text-secondary);">
        <p style="font-weight: 600; color: var(--text-primary); margin-bottom: 0.5rem;"><i class="fa-solid fa-bus"></i> Transit.IN</p>
        <p style="font-size: 0.9rem; margin-bottom: 1rem;">Smart Public Transport Tracker</p>
        <div style="display: flex; justify-content: center; gap: 1.5rem; font-size: 1.2rem;">
            <a href="#" style="color: var(--text-secondary); transition: color 0.2s;"><i class="fa-brands fa-github"></i></a>
            <a href="#" style="color: var(--text-secondary); transition: color 0.2s;"><i class="fa-brands fa-linkedin"></i></a>
        </div>
        <p style="font-size: 0.8rem; margin-top: 1.5rem;">Developed by Shreya &copy; 2026</p>
    </footer>

    <!-- Loading Overlay -->
    <div id="city-loader" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg-color); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.3s;">
        <div class="spinner"></div>
        <h2 style="margin-top: 1rem; color: var(--accent-color);" id="loader-text">Loading...</h2>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="js/app.js"></script>
    <script src="js/tracking.js"></script>
</body>
</html>
